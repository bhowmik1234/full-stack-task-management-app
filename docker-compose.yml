name: ecommerce

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # exposed so migrations/psql can run from the host; drop this in prod
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Applies pending Prisma migrations, then exits. Runs to completion before
  # the backend starts, so a fresh `docker compose up` on an empty volume
  # produces a working schema instead of a backend crash-looping against
  # missing tables. Reuses the backend image — no second build.
  migrate:
    image: ecommerce-backend:latest
    build:
      context: ./backend
    restart: "no"
    command: ["npm", "run", "migrate:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required — see .env.example}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: ecommerce-backend:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required — see .env.example}
      STRIPE_KEY: ${STRIPE_KEY:?STRIPE_KEY is required — see .env.example}
      CLOUD_NAME: ${CLOUD_NAME:-}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_API_SECRET: ${CLOUD_API_SECRET:-}
    volumes:
      # product photos live on local disk; this keeps them across redeploys
      - uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./client
      args:
        VITE_SERVER: ${VITE_SERVER:?VITE_SERVER is required — see .env.example}
        VITE_STRIPE_PROMISES: ${VITE_STRIPE_PROMISES:?VITE_STRIPE_PROMISES is required}
        VITE_FIREBASE_KEY: ${VITE_FIREBASE_KEY:?VITE_FIREBASE_KEY is required}
        VITE_FIREBASE_DOMAIN: ${VITE_FIREBASE_DOMAIN:?VITE_FIREBASE_DOMAIN is required}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID is required}
        VITE_FIREBASE_BUCKET: ${VITE_FIREBASE_BUCKET:-}
        VITE_FIREBASE_SENDER_ID: ${VITE_FIREBASE_SENDER_ID:-}
        VITE_FIREBASE_APPID: ${VITE_FIREBASE_APPID:?VITE_FIREBASE_APPID is required}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    image: ecommerce-web:latest
    restart: unless-stopped
    ports:
      # bind 8080 instead if a host-level nginx/Caddy terminates TLS in front
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
  pgdata:
