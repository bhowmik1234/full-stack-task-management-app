server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # product photo uploads go through here (multer); nginx defaults to 1m
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Resolving through a variable (rather than a literal
    # host in proxy_pass) re-resolves on a TTL instead of caching the IP at
    # startup — otherwise recreating just the backend container serves 502s
    # against a dead IP until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    # Everything below shares one origin with the SPA, so VITE_SERVER can be the
    # site's own URL and CORS never comes into play.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # served by `app.use('/uploads', express.static("uploads"))`
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames into /assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # never cache the entrypoint, or clients pin to a stale bundle after deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
