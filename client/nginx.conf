# Two sites from one image and one build directory.
#
#   app.admin.<domain>  -> admin.html  (the console SPA)
#   everything else     -> index.html  (the storefront SPA)
#
# The split is by server_name, so the console's entry document is only ever
# served on the console's host. A shopper cannot reach it by guessing a path —
# /admin on the storefront falls through to index.html and renders the shop's
# 404 — and the console's own host serves no storefront routes.
#
# Both hosts proxy /api and /uploads to the same backend, which is what keeps
# each SPA same-origin with the API: no CORS preflights, and the backend's
# ADMIN_URL origin pin sees exactly one origin for admin traffic.

# ---- shared pieces --------------------------------------------------------
# Docker's embedded DNS. Resolving through a variable (rather than a literal
# host in proxy_pass) re-resolves on a TTL instead of caching the IP at startup
# — otherwise recreating just the backend container serves 502s against a dead
# IP until nginx is restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---- storefront -----------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # product photo uploads go through here (multer); nginx defaults to 1m
    client_max_body_size 10m;
    server_tokens off;

    # The storefront's CSP. The console has had one since it was built; this
    # host went without, which is the wrong way round — the shop is the side
    # that renders product copy, review text and customer names, so it is the
    # side an injection would land on. React escapes by default and there is no
    # dangerouslySetInnerHTML anywhere in the bundle, but that is one careless
    # commit away from being untrue, and a CSP is the control that survives it.
    #
    # Held in a variable because it has to be repeated verbatim in the
    # `= /index.html` block below (add_header is not inherited by a location
    # that sets headers of its own) and two hand-maintained copies of a policy
    # this long drift — the console's pair already shows how easily.
    #
    # What each third party is here for, since none of it is optional:
    #   checkout.razorpay.com  the payment modal, injected on demand by
    #                          utils/razorpay.ts; api/lumberjack are the calls
    #                          and telemetry it makes once open. Dropping any of
    #                          them breaks checkout, which is the one failure
    #                          here nobody can work around.
    #   apis/gstatic/google    Firebase auth: the Google sign-in popup and the
    #                          invisible reCAPTCHA that phone sign-in needs.
    #   googletagmanager +     Firebase Analytics, loaded at idle from
    #   google-analytics       src/firebase.ts. Absent on the console by design.
    #   fonts.googleapis/gstatic  the two families index.html links.
    #
    # `connect-src 'self'` assumes the API is same-origin, which it is behind
    # this nginx — both blocks proxy /api. A deploy that points VITE_SERVER at a
    # separate backend host has to add that origin here or every request is
    # blocked; that is the one edit this policy is likely to need.
    set $csp "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://apis.google.com https://www.google.com https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://www.googleapis.com https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://*.firebaseapp.com https://www.google.com https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

    # add_header is not inherited by a location block that defines its own, so
    # these are repeated in the locations below that set headers.
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    # Keeps the opener relationship with the Google sign-in popup so Firebase can
    # close it and resolve signInWithPopup. Plain `same-origin` would break login.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Without this, nginx compresses *nothing* it proxies: the default is
    # `gzip_proxied off`, and every /api response comes from the backend
    # upstream. The bundle was gzipped and the JSON behind it was not — which is
    # the larger payload on any catalogue or order page.
    gzip_proxied any;
    # These URLs serve gzipped and plain bytes depending on the request's
    # Accept-Encoding, so anything caching in between has to vary on it.
    gzip_vary on;

    set $backend_upstream http://backend:3000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # served by `app.use('/uploads', express.static("uploads"))`
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Crawler documents, proxied rather than served as files from the bundle.
    #
    # The sitemap has to list the catalogue, and the catalogue is a table — a
    # static file in client/public would be a snapshot that is wrong the moment
    # a product is added, and a stale sitemap is something nobody notices.
    # They are proxied to *this* host so a crawler fetches them from the origin
    # whose pages they describe; a sitemap served from another host is ignored.
    #
    # Storefront only. The console block below returns its own blanket-deny
    # robots.txt and has no sitemap, because nothing should crawl a console.
    location = /sitemap.xml {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames into /assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The console's entry document is not served from this host at all. Without
    # this it would be reachable as a static file at /admin.html, which would
    # hand the console's bundle to a shopper's browser on the shop's origin.
    location = /admin.html {
        return 404;
    }

    # never cache the entrypoint, or clients pin to a stale bundle after deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- admin console --------------------------------------------------------
server {
    listen 80;
    # Matches app.admin.<anything>. Pin it to your exact hostname in production
    # if this nginx ever answers for domains you do not control.
    server_name ~^app\.admin\..+$;

    root /usr/share/nginx/html;
    index admin.html;

    client_max_body_size 10m;
    server_tokens off;

    # Stricter than the storefront's, because this host has no third-party
    # embeds to accommodate: no ads, no analytics, no social widgets. The
    # `'unsafe-inline'` on styles is what Vite's injected style tags need;
    # scripts are all bundled files, so script-src stays on 'self'.
    #
    # The google.com / gstatic.com / firebaseapp.com entries are exactly what
    # Firebase auth needs: the Google sign-in popup, the invisible reCAPTCHA
    # that phone sign-in requires, and the token endpoints. Without them nobody
    # can sign in here. Note what is *not* listed — the console runs no
    # analytics (src/admin/firebase.ts omits it deliberately), so no tag
    # manager, no GA, no third-party script of any kind.
# Held in a variable for the same reason the storefront's is: this policy has
    # to be repeated verbatim in `= /admin.html` below, and it was previously two
    # hand-maintained copies — an edit to one that missed the other would have
    # applied a different policy to the entry document than to everything else,
    # which is exactly the kind of difference nobody notices.
    #
    # Stricter than the storefront's, and stays that way: no Razorpay (an
    # operator never pays for anything) and no analytics — src/admin/firebase.ts
    # omits it deliberately, so an operator's clicks through customer records
    # are not product analytics. Adding a third-party script here should take an
    # argument.
    set $csp "default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://www.googleapis.com https://www.google.com; frame-src https://*.firebaseapp.com https://www.google.com https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # No referrer at all: an admin URL can carry an order or customer id, and
    # there is nothing on this host worth leaking a path to.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Belt and braces with the <meta name="robots"> in admin.html: a search
    # engine that fetches the bundle or an asset never sees the tag.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Without this, nginx compresses *nothing* it proxies: the default is
    # `gzip_proxied off`, and every /api response comes from the backend
    # upstream. The bundle was gzipped and the JSON behind it was not — which is
    # the larger payload on any catalogue or order page.
    gzip_proxied any;
    # These URLs serve gzipped and plain bytes depending on the request's
    # Accept-Encoding, so anything caching in between has to vary on it.
    gzip_vary on;

    set $backend_upstream http://backend:3000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Nothing crawls a console, and a stray index.html on this host would serve
    # the storefront bundle from the admin origin.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /index.html {
        return 404;
    }

    # try_files re-runs location matching, so the SPA entry document is served
    # *through* this block — every header the server-level set has to be
    # repeated here or admin.html would go out with none of them.
    location = /admin.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Client-side routing: every console path is admin.html.
    location / {
        try_files $uri /admin.html;
    }
}
